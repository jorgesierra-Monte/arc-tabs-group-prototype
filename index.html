<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arc · Tab Group — hover directions</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="compare">
    <section class="direction" data-direction="a" aria-labelledby="dir-a-title">
      <div class="direction-inner">
        <div class="direction-head">
          <span class="direction-badge">A</span>
          <div>
            <h2 class="direction-title" id="dir-a-title">Text hover</h2>
            <p class="direction-desc">Hover darkens the label only. No padding, no surface.</p>
          </div>
        </div>

        <div class="stage">
          <div class="tab-group" data-tab-group></div>
          <div class="tab-panel" data-tab-panel role="tabpanel"></div>
        </div>

        <h3 class="section-label">States</h3>
        <div class="states" data-states></div>
      </div>
    </section>

    <section class="direction" data-direction="b" aria-labelledby="dir-b-title">
      <div class="direction-inner">
        <div class="direction-head">
          <span class="direction-badge">B</span>
          <div>
            <h2 class="direction-title" id="dir-b-title">Surface hover</h2>
            <p class="direction-desc">Hover fills a soft surface behind the tab. The underline sits inset under the label.</p>
          </div>
        </div>

        <div class="stage">
          <div class="tab-group" data-tab-group></div>
          <div class="tab-panel" data-tab-panel role="tabpanel"></div>
        </div>

        <h3 class="section-label">States</h3>
        <div class="states" data-states></div>
      </div>
    </section>
  </main>

  <div class="controls">
    <!-- Easing picker (opens above the Motion bar) -->
    <div class="easing-popover" id="easing-popover" hidden>
      <div class="easing-preview">
        <div class="easing-preview-name" data-preview-name></div>
        <svg class="easing-preview-graph" data-preview-graph viewBox="0 0 200 200" aria-hidden="true"></svg>
        <div class="easing-preview-track" aria-hidden="true"><span class="easing-preview-dot" data-preview-dot></span></div>
        <div class="easing-value">
          <code data-preview-value></code>
          <button type="button" class="copy" data-copy>Copy</button>
        </div>
      </div>
      <div class="easing-list" data-easing-list role="radiogroup" aria-label="Easing curve"></div>
    </div>

    <!-- Motion controls -->
    <div class="bar motion-bar" role="toolbar" aria-label="Motion controls">
      <span class="bar-title">Motion</span>
      <div class="segmented" data-motion-target role="radiogroup" aria-label="Apply motion to">
        <button type="button" role="radio" data-value="a">A</button>
        <button type="button" role="radio" data-value="b">B</button>
        <button type="button" role="radio" data-value="both">Both</button>
      </div>
      <span class="bar-divider" aria-hidden="true"></span>
      <div class="segmented" data-motion-mode role="radiogroup" aria-label="Indicator animation">
        <button type="button" role="radio" data-value="none">None</button>
        <button type="button" role="radio" data-value="slide">Slide</button>
        <button type="button" role="radio" data-value="stretch">Stretch</button>
        <button type="button" role="radio" data-value="grow">Grow</button>
      </div>
      <span class="bar-divider" aria-hidden="true"></span>
      <button type="button" class="chip-button" data-easing-trigger aria-haspopup="true" aria-expanded="false" aria-controls="easing-popover">
        <svg data-trigger-thumb width="24" height="20" viewBox="0 0 24 20" aria-hidden="true"></svg>
        <span class="easing-trigger-name" data-trigger-name></span>
        <svg class="chevron" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 6.5 5 3.5 8 6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="bar-divider" aria-hidden="true"></span>
      <label class="duration">
        <span>Duration</span>
        <input type="range" min="100" max="1200" step="25" data-duration />
        <output data-duration-value></output>
      </label>
      <button type="button" class="replay" data-replay title="Select the next tab (R)">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.8v8.4L10 6z" fill="currentColor"/></svg>
        Replay
      </button>
    </div>

    <!-- Hover behaviour (applies to the same Motion target) -->
    <div class="bar hover-bar" role="toolbar" aria-label="Hover controls">
      <span class="bar-title">Hover</span>
      <div class="bar-group toggles">
        <label class="switch" data-follow-wrap title="Direction B only"><input type="checkbox" data-hover="followSurface" /><span>Follow surface <em class="only-b">B</em></span></label>
        <label class="switch"><input type="checkbox" data-hover="previewLine" /><span>Preview line</span></label>
      </div>
    </div>

  </div>

  <!-- Variants: vertical stack centred on the dividing line -->
  <div class="variants" role="toolbar" aria-label="Tab variants">
    <div class="variants-group">
      <div class="variants-head"><span class="bar-label">A</span><span class="bar-title">Type</span></div>
      <div class="segmented is-vertical" data-type-control="a" role="radiogroup" aria-label="Direction A tab type">
        <button type="button" role="radio" data-value="default">Default</button>
        <button type="button" role="radio" data-value="count">With count</button>
        <button type="button" role="radio" data-value="icon">With icon</button>
      </div>
    </div>
    <div class="variants-group">
      <div class="variants-head"><span class="bar-label">B</span><span class="bar-title">Type</span></div>
      <div class="segmented is-vertical" data-type-control="b" role="radiogroup" aria-label="Direction B tab type">
        <button type="button" role="radio" data-value="default">Default</button>
        <button type="button" role="radio" data-value="count">With count</button>
        <button type="button" role="radio" data-value="icon">With icon</button>
      </div>
    </div>
    <div class="variants-group toggles">
      <label class="switch"><input type="checkbox" data-toggle="divider" checked /><span>Divider</span></label>
      <label class="switch"><input type="checkbox" data-toggle="disabled" checked /><span>Disabled tab</span></label>
    </div>
  </div>

  <script src="easings.js"></script>
  <script src="script.js"></script>
</body>
</html>
